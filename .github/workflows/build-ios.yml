name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install dependencies
        run: npm install

      - name: Generate iOS Xcode project
        run: npx tauri ios init --ci

      - name: Build frontend
        run: npm run build

      - name: Build app (unsigned)
        run: |
          xcodebuild -project src-tauri/gen/apple/amble.xcodeproj \
            -scheme amble \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/amble.app Payload/
          zip -r amble-ios-unsigned.ipa Payload/

      - uses: actions/upload-artifact@v4
        with:
          name: amble-ios-unsigned
          path: amble-ios-unsigned.ipa
