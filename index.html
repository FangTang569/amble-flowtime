<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>amble</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            mono: ['"Inter"', 'system-ui', 'sans-serif'],
          },
          colors: {
            accent: '#2dd4bf',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="h-full bg-white text-neutral-800 antialiased">

  <!-- App Shell -->
  <div id="app" class="h-full flex flex-col items-center overflow-y-auto px-6 py-8 select-none">

    <!-- Brand wordmark -->
    <p class="text-neutral-400 text-xs tracking-[0.2em] uppercase mb-8">amble</p>

    <!-- State label (shown during rest) -->
    <p id="state-label" class="text-accent text-sm font-medium mb-2 hidden"></p>

    <!-- Timer display -->
    <div id="timer-container" class="mb-8">
      <span id="timer-minutes" class="font-mono text-7xl font-light tracking-tight tabular-nums">00</span>
      <span id="timer-colon" class="timer-colon font-mono text-7xl font-light tracking-tight tabular-nums">:</span>
      <span id="timer-seconds" class="font-mono text-7xl font-light tracking-tight tabular-nums">00</span>
    </div>

    <!-- Ratio control -->
    <div class="w-full max-w-xs mb-6">
      <div class="flex items-center justify-between mb-1.5">
        <label for="ratio-slider" class="text-neutral-500 text-sm">Rest ratio</label>
        <span id="ratio-display" class="text-neutral-600 text-sm font-mono tabular-nums">20% (work 5:1)</span>
      </div>
      <input
        id="ratio-slider"
        type="range"
        min="5"
        max="100"
        value="20"
        step="1"
        class="w-full h-1.5 rounded-full cursor-pointer"
      />
      <div class="flex justify-between text-neutral-400 text-xs mt-1">
        <span>5%</span>
        <span>50%</span>
        <span>100%</span>
      </div>
    </div>

    <!-- Rest preview panel (conditional) -->
    <div id="rest-preview" class="w-full max-w-xs bg-neutral-50 border border-neutral-200 rounded-xl p-4 mb-6 hidden transition-opacity duration-300">
      <div class="flex justify-between items-center mb-2">
        <span class="text-neutral-500 text-sm">Worked</span>
        <span id="preview-work-time" class="text-neutral-700 text-sm font-mono tabular-nums">00:00</span>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-accent text-sm">Rest</span>
        <span id="preview-rest-time" class="text-accent text-sm font-mono tabular-nums">00:00</span>
      </div>
    </div>

    <!-- Control buttons -->
    <div id="controls" class="flex flex-col items-center gap-3 w-full max-w-xs">

      <!-- Primary action row -->
      <div class="flex items-center gap-3">
        <button id="btn-start"
          class="bg-accent hover:bg-teal-300 text-neutral-950 rounded-full transition-colors cursor-pointer w-12 h-12 flex items-center justify-center">
          <svg width="18" height="20" viewBox="0 0 18 20" fill="currentColor" class="ml-1.5">
            <path d="M0 0v20l18-10z"/>
          </svg>
        </button>
        <button id="btn-pause"
          class="bg-neutral-200 hover:bg-neutral-300 text-neutral-800 font-semibold px-10 py-3 rounded-full transition-colors cursor-pointer text-base hidden">
          Pause
        </button>
        <button id="btn-resume"
          class="bg-accent hover:bg-teal-300 text-neutral-950 font-semibold px-10 py-3 rounded-full transition-colors cursor-pointer text-base hidden">
          Resume
        </button>
        <button id="btn-rest"
          class="bg-accent hover:bg-teal-300 text-neutral-950 font-semibold px-10 py-3 rounded-full transition-colors cursor-pointer text-base hidden">
          Start Rest
        </button>
      </div>

      <!-- End session link -->
      <button id="btn-stop"
        class="text-neutral-400 hover:text-neutral-600 text-sm underline underline-offset-4 transition-colors cursor-pointer hidden">
        End Session
      </button>

      <!-- Overlay toggle -->
      <button id="btn-overlay"
        class="text-neutral-500 hover:text-accent text-xs transition-colors cursor-pointer mt-1">
        Show Overlay
      </button>
    </div>

    <!-- Time block timeline -->
    <div id="timeline-section" class="w-full max-w-xs mt-6 hidden">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-1.5">
          <p class="text-neutral-400 text-xs tracking-[0.2em] uppercase">Flow</p>
          <button id="timeline-scale" class="text-neutral-300 text-xs hover:text-accent transition-colors cursor-pointer font-mono tabular-nums">2h</button>
        </div>
        <p id="timeline-total" class="text-neutral-400 text-xs font-mono tabular-nums"></p>
      </div>
      <div id="timeline-rows" class="flex flex-col gap-2"></div>
      <div id="timeline-labels" class="flex justify-between mt-1.5"></div>
    </div>

    <!-- Today's sessions -->
    <div id="history-section" class="w-full max-w-xs mt-6 hidden">
      <div class="flex items-center justify-between mb-3">
        <p class="text-neutral-400 text-xs tracking-[0.2em] uppercase">Today</p>
        <p id="history-stats" class="text-neutral-400 text-xs font-mono tabular-nums"></p>
      </div>
      <div id="history-list" class="hidden"></div>
      <p id="history-empty" class="text-neutral-400 text-sm text-center">No sessions yet</p>
    </div>

  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
